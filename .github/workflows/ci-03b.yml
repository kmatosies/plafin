name: 03B local checks (partial G1)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci
      - name: Lint, types and build
        working-directory: frontend
        run: |
          npm run lint
          npm exec -- tsc -b --pretty false
          npm run build
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install pinned project dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Compile and test without shared services
        working-directory: backend
        env:
          ENABLE_NOTIFICATION_WORKER: 'false'
        run: |
          python -m compileall -q app
          python -m pytest -q -p no:cacheprovider

  python_audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt

  secrets_scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  docker_smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image and verify non-root health
        run: |
          docker build -t plafin-api:ci backend
          test "$(docker image inspect --format '{{.Config.User}}' plafin-api:ci)" = plafin
          docker run --name plafin-api-ci -d -e ENABLE_NOTIFICATION_WORKER=false -p 127.0.0.1:18080:8000 plafin-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs plafin-api-ci
          exit 1
      - name: Remove CI container
        if: always()
        run: docker rm -f plafin-api-ci || true

  gate:
    name: 03B partial gate
    if: ${{ always() }}
    needs: [frontend, backend, python_audit, secrets_scan, docker_smoke]
    runs-on: ubuntu-24.04
    env:
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      PYTHON_AUDIT_RESULT: ${{ needs.python_audit.result }}
      SECRETS_SCAN_RESULT: ${{ needs.secrets_scan.result }}
      DOCKER_SMOKE_RESULT: ${{ needs.docker_smoke.result }}
    steps:
      - name: Require every implemented job to succeed
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$PYTHON_AUDIT_RESULT" = success
          test "$SECRETS_SCAN_RESULT" = success
          test "$DOCKER_SMOKE_RESULT" = success
